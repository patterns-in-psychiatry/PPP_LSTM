[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ppp-benchmark"
version = "0.1.0"
description = "Research infrastructure for Psychosis Prognosis Predictor benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["ppp", "ppp.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["ppp/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
